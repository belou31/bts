# /etc/nginx/sites-available/bts.conf
server {
  listen 80;
  server_name billetterie-test.belougas.fr;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name billetterie-test.belougas.fr;

  # Sécurité / headers utiles
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # Certbot
  ssl_certificate     /etc/letsencrypt/live/billetterie-test.belougas.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billetterie-test.belougas.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # Reverse-proxy de tout le sous-arbre /bts vers Node EN PRÉSERVANT L’URI
  location ^~ /bts/ {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ⚠️ PAS de slash final ici → on NE STRIPPE PAS /bts/
    proxy_pass http://127.0.0.1:8080;
  }

  # Ce bloc regex ne s’applique plus aux URLs /bts/ grâce à ^~ ci-dessus
  location ~* \.(css|js|ico|png|svg|jpg|jpeg|gif)$ {
    expires 7d;
    access_log off;

  # éviter des 404 parasites sur le favicon
  location = /favicon.ico { return 204; }

  }
}
