server {
  listen 80;
  server_name billetterie.belougas.fr;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name billetterie.belougas.fr;

  ssl_certificate     /etc/letsencrypt/live/billetterie.belougas.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billetterie.belougas.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  location /bts/ {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ⚠️ PAS de slash final
    proxy_pass http://127.0.0.1:8080;
  }

  location = /favicon.ico { return 204; }
}
