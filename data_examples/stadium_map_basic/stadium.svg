<style id="style1">

	rect.legend_zone { fill:lightyellow;fill-opacity:1;stroke:yellow;stroke-width:0.1;stroke-linejoin:round; }
 
	text.legend_zone { font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8px;font-family:Sans;font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;fill:#000000;fill-opacity:1;stroke:#000000;stroke-width:0.0989055;stroke-linejoin:round;stroke-opacity:1; }

	text.legend_row { font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:6px;font-family:Sans;font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;fill:#000000;fill-opacity:1;stroke:#000000;stroke-width:0.0989055;stroke-linejoin:round;stroke-opacity:1 }

	text.legend_text { font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:5px;font-family:Sans;font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;fill:#5f6ce1;fill-opacity:1;stroke:#000000;stroke-width:0.0989055;stroke-linejoin:round;stroke-opacity:1 } 

	rect.seat { fill:lightgrey;stroke:darkgrey;stroke-width:0.8;stroke-linejoin:round }

	rect.seat.seat-available	{ fill: lightgreen; }
	rect.seat.seat-booked		{ fill: red; }
	rect.seat.seat-busy			{ fill: orange; }
	rect.seat.seat-selected		{ fill: blue; }

</style>

