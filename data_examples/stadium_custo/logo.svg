      .red { fill: #E11D2E; }
      .dark { fill: #16161A; }
      .line { stroke: rgba(225,29,46,0.7); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .word { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>
  <!-- MARK (left) -->
  <g
