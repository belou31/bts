       x="158"
       y="132"
       width="44"
       height="38"
       rx="12"
       id="rect3" />
    <rect
       class="line"
       x="158"
       y="190"
       width="44"
       height="38"
       rx="12"
       id="rect4" />
    <!-- entrances -->
    <g
