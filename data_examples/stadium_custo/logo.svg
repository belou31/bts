    <rect
       style="fill:#ffffff;stroke:#6477ff;stroke-width:0.373816;stroke-linejoin:round"
       id="rect11"
       width="1386.7262"
       height="407.58502"
       x="6.2465291"
       y="5.4657001" />
  </g>
  <g
     transform="translate(40,30)"
     id="g10">
    <!-- outer bowl -->
    <ellipse
       class="red"
       cx="180"
       cy="180"
       rx="154"
       ry="118"
       id="ellipse1" />
