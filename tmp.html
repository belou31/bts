<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Renouvellement d’abonnement 2025-2026— BTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/bts/">
  <link rel="icon" href="public/static/img/favicon.ico">
  <link rel="stylesheet" href="public/static/styles/renew.css">
</head>
<body>
  <header class="renew-header">
    <img class="club-logo" src="public/static/img/logo.png" alt="Logo du club" />
    <h1>Renouvellement d’abonnement 2025 2026</h1>
  </header>

  <main class="renew-layout" id="renewLayout">
    <section class="plan-col">
      <div class="plan-wrap">
        <object id="venuePlan" type="image/svg+xml" data="" aria-label="Plan de la salle"></object>
        <div class="plan-hint">Molette = zoom (centré souris) • Glisser = déplacer</div>
      </div>
    </section>

    <section class="order-col" id="orderPanel">
      <h2>Vos places</h2>

      <div class="cart-head grid-row">
        <div class="col chk"> </div>
        <div class="col seat">Place</div>
        <div class="col name">Nom</div>
        <div class="col name">Prénom</div>
        <div class="col tariff">Tarif</div>
      </div>

      <div id="cartRows" class="cart-rows"></div>

      <h2>Paiement</h2>
      <form id="payerForm" class="payer-form">
        <!-- Ligne 1 : 30 / 30 / 40 -->
        <div class="field">
          <label for="payerLastName">Nom</label>
          <input id="payerLastName" name="lastName" autocomplete="family-name" required>
        </div>
        <div class="field">
          <label for="payerFirstName">Prénom</label>
          <input id="payerFirstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="payerEmail">Email de contact</label>
          <input id="payerEmail" name="email" type="email" autocomplete="email" required>
        </div>

        <!-- Ligne 2 : 30 / 30 / 40 -->
        <div class="field small">
          <label for="schedule">Échéancier</label>
          <select id="schedule" name="schedule">
            <option value="1">1 fois</option>
            <option value="2">2 fois</option>
            <option value="3">3 fois</option>
          </select>
        </div>
        <div class="field small">
          <label>Échéance</label>
          <div id="installmentAmount" class="total-box">—</div>
        </div>
        <div class="field small total">
          <label>Total</label>
          <div id="totalAmount" class="total-box">0,00 €</div>
        </div>
      </form>

      <button id="payBtn" class="pay-btn">Procéder au paiement</button>
      <p class="fine-print">
        Le reçu et la confirmation seront envoyés à cet email. Les billets (QR codes)
        seront expédiés par email <b>match par match</b>.
      </p>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="views/renew/renew.js"></script>
</body>
</html>
